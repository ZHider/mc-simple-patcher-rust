[package]
name = "mc_simple_patcher"
version = "0.2.8"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
bytes = "1.9.0"
chrono = "0.4.43"
clap = { version = "4.5.58", features = ["derive"] }
console = "0.16.2"
env_logger = "0.11.9"
flate2 = "1.1.9"
futures = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
indicatif = "0.18.3"
log = "0.4.29"
qbsdiff = "1.4.4"
rayon = "1.11.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = [
    "stream",
    "http3",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.8"
walkdir = "2.5.0"
zip = "8.1.0"

[dev-dependencies]
mockall = "0.13.0"
proptest = "1.6.0"
rand = "0.10.0"
rstest = "0.26.1"
tempfile = "3.25.0"
tokio = { version = "1.49.0", features = ["full", "test-util"] }
wiremock = "0.6"
